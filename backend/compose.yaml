services:
  postgres:
    image: postgres:17
    container_name: dongnae-db
    environment:
      POSTGRES_DB: dongnae
      POSTGRES_USER: dongnae
      POSTGRES_PASSWORD: dongnae
    ports:
      - "5432:5432"
    volumes:
      - dongnae-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

volumes:
  dongnae-data: