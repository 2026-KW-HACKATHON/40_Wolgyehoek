name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render backend health
        run: curl -fsS -m 90 --retry 3 --retry-delay 10 https://dongne-seorap-api.onrender.com/api/health
