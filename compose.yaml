services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dongnae
      POSTGRES_USER: dongnae
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - dongnae-data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dongnae -d dongnae"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dongnae
      SPRING_DATASOURCE_USERNAME: dongnae
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OPERATOR_CODE: ${OPERATOR_CODE:-}
      DEMO_CREDITS: ${DEMO_CREDITS:-false}
      DEMO_SEED: ${DEMO_SEED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - dongnae-media:/app/data/media
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: .
    environment:
      SPRING_API_URL: http://backend:8080
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  dongnae-data:
  dongnae-media:
